<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Sleek dark theme -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#16161A" />
    </linearGradient>

    <!-- Logo Gradient: Flow Orange (High contrast, vibrant) -->
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="30%" stop-color="#FF5C00" />
      <stop offset="100%" stop-color="#FF2E00" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow for elements -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle (Maskable Safe Area Background) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Glowing Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#flow-grad)" stroke-width="6" stroke-opacity="0.15" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#flow-grad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Main Flow Ticket Icon -->
  <g filter="url(#shadow)" transform="translate(106, 126)">
    <!-- Ticket Back/Glow -->
    <path d="M 30 0 
             L 270 0 
             A 30 30 0 0 1 300 30 
             L 300 90 
             A 24 24 0 0 0 276 114 
             A 24 24 0 0 0 300 138 
             L 300 230 
             A 30 30 0 0 1 270 260 
             L 30 260 
             A 30 30 0 0 1 0 230 
             L 0 138 
             A 24 24 0 0 0 24 114 
             A 24 24 0 0 0 0 90 
             L 0 30 
             A 30 30 0 0 1 30 0 Z" 
          fill="url(#flow-grad)" 
          filter="url(#glow)" 
          opacity="0.15" />

    <!-- Solid Ticket Base -->
    <path d="M 30 0 
             L 270 0 
             A 30 30 0 0 1 300 30 
             L 300 90 
             A 24 24 0 0 0 276 114 
             A 24 24 0 0 0 300 138 
             L 300 230 
             A 30 30 0 0 1 270 260 
             L 30 260 
             A 30 30 0 0 1 0 230 
             L 0 138 
             A 24 24 0 0 0 24 114 
             A 24 24 0 0 0 0 90 
             L 0 30 
             A 30 30 0 0 1 30 0 Z" 
          fill="url(#flow-grad)" />

    <!-- Stylized "Flow" Dynamic Cut / Energy Wave (Negativo) -->
    <path d="M 60 40 
             C 140 40, 120 220, 240 220 
             L 240 200 
             C 150 200, 160 60, 60 60 Z" 
          fill="#0A0A0C" 
          opacity="0.25" />

    <!-- Ticket Divider Dots (Sleek Cutout Design) -->
    <line x1="80" y1="40" x2="80" y2="220" stroke="#0A0A0C" stroke-width="4" stroke-dasharray="8 8" opacity="0.3" stroke-linecap="round" />

    <!-- Fast Forward / Quick Transaction Arrows (Flow) -->
    <path d="M 140 100 L 170 130 L 140 160" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 180 100 L 210 130 L 180 160" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>
